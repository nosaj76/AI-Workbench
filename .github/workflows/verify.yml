name: Rust validation
on: [push, pull_request, workflow_dispatch]
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Native build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libxkbcommon-dev libgl1-mesa-dev libwayland-dev
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Packaging tests (no inference)
        run: python3 scripts/test_package.py
      - name: Build and test the actual source
        run: ./verify.sh
      - name: Native X11 chat, local inference and conversation recovery
        timeout-minutes: 20
        run: |
          git fetch --depth=1 origin b3fdf672f8bc1f8f32c78b6537ed7382f69f8666
          git diff --exit-code b3fdf672f8bc1f8f32c78b6537ed7382f69f8666 HEAD -- Cargo.toml Cargo.lock build.rs src
          sudo apt-get install -y xvfb xauth xdotool python3-xlib python3-pil tesseract-ocr mesa-utils libgl1-mesa-dri zstd
          bash scripts/verify-native-chat.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: validation-logs
          path: reports/local-build/
