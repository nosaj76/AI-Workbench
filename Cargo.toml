[package]
name = "ollama-workbench"
version = "0.4.0-rc.8"
edition = "2021"
rust-version = "1.89"
description = "Native Rust desktop workspace for local Ollama chat, files, retrieval and tools"
license = "MIT"
repository = "https://github.com/nosaj76/AI-Workbench"
readme = "README.md"
keywords = ["ollama", "llm", "desktop", "local-ai", "egui"]
categories = ["gui"]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
directories = "6.0"
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "__screenshot"] }
egui_commonmark = { version = "=0.20.0", default-features = false, features = ["pulldown_cmark", "better_syntax_highlighting"] }
futures-util = "0.3"
flate2 = "1"
ignore = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
libc = "0.2"
quick-xml = "0.37"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "blocking", "multipart"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
rusqlite = { version = "0.32", features = ["bundled"] }
scraper = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util", "net"] }
url = "2.5"
uuid = { version = "1", features = ["v4", "serde"] }
vt100 = "=0.18.1"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
zstd = "0.13"

[dev-dependencies]
tempfile = "3.14"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[[bin]]
name = "ollama-workbench"
path = "src/main.rs"
